<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales Leaderboard — WooWoo World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C0333; --paper:#F4F2F8; --paper-dim:#E9ECF2;
    --brass:#C79529; --brass-dark:#97711F; --line:#D4D6DC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5;}
  h1{font-family:'Newsreader',serif; font-style:italic; font-weight:500;}
  main{max-width:640px; margin:0 auto; padding:64px 24px 96px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass-dark); margin-bottom:14px;}
  h1{font-size:clamp(28px,4vw,38px); margin-bottom:8px;}
  .sub{color:#5C566B; font-size:14px; margin-bottom:32px;}
  table{width:100%; border-collapse:collapse; background:var(--paper);}
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em;
    text-transform:uppercase; color:#8F8A9C; padding:10px 16px; border-bottom:2px solid var(--ink);
  }
  td{padding:14px 16px; border-bottom:1px solid var(--line); font-size:15px;}
  tr:first-child td{background:var(--brass); color:var(--ink); font-weight:600;}
  .rank{font-family:'IBM Plex Mono',monospace; color:#8F8A9C; width:40px;}
  tr:first-child .rank{color:var(--ink);}
  .empty{color:#8F8A9C; font-size:14px; padding:32px 0;}
</style>
</head>
<body>
<main>
  <div class="eyebrow">WooWoo World · Sales</div>
  <h1>Leaderboard</h1>
  <p class="sub">Ranked by total delegates sold, across all cohorts.</p>
  <div id="content"><p class="empty">Loading…</p></div>
</main>
<script>
(async () => {
  const el = document.getElementById('content');
  try {
    const res = await fetch('/.netlify/functions/leaderboard');
    const data = await res.json();
    if (!data.standings || data.standings.length === 0) {
      el.innerHTML = '<p class="empty">No qualifying sales recorded yet.</p>';
      return;
    }
    const rows = data.standings.map((s, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>${s.repCode}</td>
        <td>${s.totalDelegates}</td>
        <td>${s.cohortsSoldInto}</td>
        <td>${s.bestSingleCohortCount} (+${Math.round(s.bestSingleCohortBonusRate * 100)}%)</td>
      </tr>
    `).join('');
    el.innerHTML = `
      <table>
        <thead><tr><th></th><th>Sales Rep</th><th>Total Delegates</th><th>Cohorts</th><th>Best Single Cohort</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch (e) {
    el.innerHTML = '<p class="empty">Could not load the leaderboard — please refresh.</p>';
  }
})();
</script>
</body>
</html>
